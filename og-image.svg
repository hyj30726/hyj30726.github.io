      <stop offset="0" stop-color="#E7EDFC"/>
      <stop offset="1" stop-color="#F4F6FA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F54EB"/>
      <stop offset="1" stop-color="#8CA8FF"/>
