<!--
  황유주 자기소개 페이지 · 새 기능: "유주 카드 짝 맞추기"
  붙이는 방법
  1) <style> 블록 → </head> 바로 위
  2) <section id="match"> 블록 → 방명록(<section id="guest">) 바로 위
  3) <script> 블록 → </body> 바로 위
  4) 상단 메뉴에 추가: <a href="#match">짝 맞추기</a>
  색은 라이트/다크 모드에 자동으로 맞춰집니다. 포인트 색은 --mg-accent 한 줄만 고치세요.
-->

<style>
  .mg { --mg-accent: #2f6fed; max-width: 640px; margin: 0 auto; }
  .mg-lead { margin: 0 0 1rem; opacity: .8; }
  .mg-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: .9rem; font-size: .95rem; }
  .mg-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6rem; }
  .mg-card { aspect-ratio: 1 / 1; border-radius: 12px; border: 1px solid rgba(127,127,127,.4); background: rgba(127,127,127,.12); color: inherit; font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; padding: .3rem; transition: transform .2s ease, background .2s ease; }
  .mg-card:focus-visible, .mg-reset:focus-visible { outline: 3px solid var(--mg-accent); outline-offset: 2px; }
  .mg-card .mg-face { display: none; }
  .mg-card .mg-face.emoji { font-size: 2rem; }
  .mg-card.open, .mg-card.done { background: transparent; border-color: var(--mg-accent); }
  .mg-card.open .mg-face, .mg-card.done .mg-face { display: block; }
  .mg-card.open .mg-back, .mg-card.done .mg-back { display: none; }
  .mg-card.done { opacity: .75; cursor: default; }
  .mg-back { font-size: 1.4rem; opacity: .5; }
  .mg-msg { margin-top: 1rem; min-height: 1.6em; font-weight: 600; }
  .mg-reset { margin-top: .6rem; padding: .6rem 1.1rem; border-radius: 8px; border: 1px solid rgba(127,127,127,.5); background: transparent; color: inherit; font: inherit; cursor: pointer; }
  @media (max-width: 420px) { .mg-card { font-size: .85rem; } .mg-card .mg-face.emoji { font-size: 1.6rem; } }
  @media (prefers-reduced-motion: reduce) { .mg-card { transition: none; } }
</style>


<section id="match" aria-labelledby="mg-title">
  <div class="mg">
    <h2 id="mg-title">유주 카드 짝 맞추기</h2>
    <p class="mg-lead">그림 카드와 이름 카드를 짝지어 보세요. 유주가 요즘 관심 있는 것들이 담겨 있어요.</p>
    <div class="mg-bar">
      <span id="mg-moves">시도 0번</span>
      <span id="mg-best">최고 기록 -</span>
    </div>
    <div class="mg-grid" id="mg-grid"></div>
    <p class="mg-msg" id="mg-msg" role="status"></p>
    <button type="button" class="mg-reset" id="mg-reset">다시 섞기</button>
  </div>
</section>


<script>
(function () {
  var PAIRS = [
    { e: "📒", t: "회계" },
    { e: "📊", t: "엑셀" },
    { e: "🏝️", t: "오키나와" },
    { e: "📜", t: "한국사" },
    { e: "🤝", t: "협업" },
    { e: "🎓", t: "국민대" }
  ];
  var grid = document.getElementById("mg-grid");
  var movesEl = document.getElementById("mg-moves");
  var bestEl = document.getElementById("mg-best");
  var msgEl = document.getElementById("mg-msg");
  var best = null, moves, matched, first, lock;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function build() {
    var cards = [];
    PAIRS.forEach(function (p, i) {
      cards.push({ id: i, kind: "emoji", text: p.e });
      cards.push({ id: i, kind: "text", text: p.t });
    });
    shuffle(cards);
    grid.innerHTML = "";
    moves = 0; matched = 0; first = null; lock = false;
    movesEl.textContent = "시도 0번";
    msgEl.textContent = "";
    cards.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "mg-card";
      b.setAttribute("aria-label", "카드");
      b.dataset.id = c.id;
      b.innerHTML = '<span class="mg-back" aria-hidden="true">?</span><span class="mg-face ' + c.kind + '">' + c.text + "</span>";
      b.addEventListener("click", function () { flip(b); });
      grid.appendChild(b);
    });
  }

  function flip(b) {
    if (lock || b.classList.contains("open") || b.classList.contains("done")) return;
    b.classList.add("open");
    b.setAttribute("aria-label", b.querySelector(".mg-face").textContent);
    if (!first) { first = b; return; }
    moves++;
    movesEl.textContent = "시도 " + moves + "번";
    var a = first; first = null;
    if (a.dataset.id === b.dataset.id) {
      a.classList.replace("open", "done"); b.classList.replace("open", "done");
      matched++;
      msgEl.textContent = "짝을 찾았어요!";
      if (matched === PAIRS.length) win();
    } else {
      lock = true;
      msgEl.textContent = "";
      setTimeout(function () {
        a.classList.remove("open"); b.classList.remove("open");
        a.setAttribute("aria-label", "카드"); b.setAttribute("aria-label", "카드");
        lock = false;
      }, 800);
    }
  }

  function win() {
    if (best === null || moves < best) { best = moves; bestEl.textContent = "최고 기록 " + best + "번"; }
    msgEl.textContent = "완성! " + moves + "번 만에 모두 맞혔어요.";
  }

  document.getElementById("mg-reset").addEventListener("click", build);
  build();
})();
</script>
