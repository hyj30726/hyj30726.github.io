<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아무거나 주방</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --tile:#17383f; --tile2:#1d444c; --panel:#fff7e6; --ink:#2b2118; --muted:#7a6a58;
  --saffron:#f2b705; --tomato:#e4572e; --mint:#8fdcbc; --line:#e6d6b8;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--tile);
  background-image:linear-gradient(var(--tile2) 1px,transparent 1px),linear-gradient(90deg,var(--tile2) 1px,transparent 1px);
  background-size:48px 48px;min-height:100vh;padding:20px 14px 60px}
.wrap{max-width:1080px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;color:#fff7e6}
h1{margin:0;font-size:34px;font-weight:400;letter-spacing:-.5px}
header p{margin:0;color:var(--mint);font-size:15px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border-radius:18px;padding:16px;border:3px solid #0e2328;box-shadow:0 6px 0 #0e2328}
h2{margin:0 0 10px;font-size:20px;font-weight:400}
.sub{color:var(--muted);font-size:14px;margin:-6px 0 10px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.ing{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 2px 6px;cursor:pointer;font-family:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.ing .e{font-size:30px;line-height:1.1}
.ing:hover{border-color:var(--saffron);transform:translateY(-2px)}
.ing:active{transform:scale(.94)}
.ing:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:#fff}
.btn{font-family:inherit;font-size:16px;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--ink);color:#fff7e6}
.btn.alt{background:#efe0c0;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.stove{text-align:center}
.pan{position:relative;margin:4px auto 10px;width:min(100%,300px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#3a3a3f 0 62%,#222 63% 100%);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;align-content:center;gap:2px;padding:44px;border:6px solid #111}
.pan.empty::after{content:"재료를 눌러\A팬에 담아 보세요";white-space:pre;color:#aaa;font-size:15px;line-height:1.4}
.pan .it{font-size:38px;cursor:pointer;animation:pop .25s}
.pan.cooking{animation:shake .25s infinite}
.pan.cooking .it{animation:jump .5s infinite alternate}
.steam{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:26px;opacity:0;pointer-events:none}
.pan.cooking .steam{animation:rise 1s infinite}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes shake{0%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}100%{transform:rotate(-2deg)}}
@keyframes jump{to{transform:translateY(-14px)}}
@keyframes rise{0%{opacity:.9;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-34px)}}
.methods{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 12px}
.m{font-family:inherit;font-size:14px;padding:7px 11px;border-radius:999px;border:2px solid var(--line);background:#fff;cursor:pointer;color:inherit}
.m[aria-pressed=true]{background:var(--saffron);border-color:var(--ink)}
.row{display:flex;gap:8px;justify-content:center}
.cook{background:var(--tomato);font-size:20px;padding:12px 28px}
.count{color:var(--muted);font-size:13px;margin:0 0 6px}
#result{margin-top:16px;display:none}
#result.show{display:block;animation:pop .35s}
.dish{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.plate{width:130px;height:130px;border-radius:50%;background:#fff;border:6px solid #e9dcc3;box-shadow:inset 0 0 0 6px #f6efe0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;font-size:30px;padding:18px;flex:none}
.info{flex:1;min-width:220px}
.title{font-size:12px;background:var(--saffron);display:inline-block;padding:2px 10px;border-radius:999px;margin-bottom:4px}
.name{font-size:26px;margin:2px 0 4px;line-height:1.2}
.stars{font-size:20px;letter-spacing:2px}
.score{color:var(--muted);font-size:14px}
.bars{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px;align-items:center}
.bar{height:10px;background:#eadcc0;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tomato);border-radius:6px}
.say{margin:12px 0 0;padding:10px 12px;background:#fff;border-radius:12px;border-left:5px solid var(--mint);font-size:15px;line-height:1.5}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.rec{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px}
.rec b{display:block;font-weight:400;font-size:16px}
.rec span{color:var(--muted);font-size:13px}
.empty-book{color:var(--muted);font-size:14px;margin:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>아무거나 주방 🍳</h1>
    <p>뭘 넣든 요리가 됩니다. 이상한 조합일수록 이야기가 생겨요.</p>
  </header>

  <div class="grid">
    <section class="card" aria-label="재료 선반">
      <h2>재료 선반</h2>
      <p class="sub">누르면 팬에 들어가요. 없는 재료는 직접 추가하세요.</p>
      <div class="shelf" id="shelf"></div>
      <form class="add" id="addForm" onsubmit="return false">
        <input id="custom" maxlength="8" placeholder="나만의 재료 (예: 라면, 용과)" aria-label="새 재료 이름">
        <button class="btn alt" type="button" id="addBtn">추가</button>
      </form>
    </section>

    <section class="card stove" aria-label="화구">
      <h2>화구</h2>
      <p class="count" id="count">0 / 6</p>
      <div class="pan empty" id="pan" aria-live="polite"><span class="steam">♨️</span></div>
      <div class="methods" id="methods" role="group" aria-label="조리법"></div>
      <div class="row">
        <button class="btn alt" id="clear" type="button">비우기</button>
        <button class="btn cook" id="cook" type="button" disabled>요리하기</button>
      </div>
      <button class="btn alt" id="rand" type="button" style="margin-top:10px">랜덤 재료 3개</button>
    </section>
  </div>

  <section class="card" id="result" aria-live="polite">
    <div class="dish">
      <div class="plate" id="plate"></div>
      <div class="info">
        <span class="title" id="rTitle"></span>
        <h2 class="name" id="rName"></h2>
        <div class="stars" id="rStars"></div>
        <div class="score" id="rScore"></div>
        <div class="bars" id="rBars"></div>
      </div>
    </div>
    <p class="say" id="rSay"></p>
  </section>

  <section class="card" style="margin-top:16px">
    <h2>레시피북 <span id="bookCount" style="color:var(--muted);font-size:15px"></span></h2>
    <div class="book" id="book"></div>
    <p class="empty-book" id="bookEmpty">아직 만든 요리가 없어요. 첫 요리를 만들어 보세요.</p>
  </section>
</div>

<script>
// 재료: [이모지, 이름, 태그]
const ING=[
["🥩","소고기","meat fat"],["🍗","닭고기","meat"],["🥓","베이컨","meat salty fat"],["🐟","생선","fish"],
["🦐","새우","fish"],["🦑","오징어","fish"],["🥚","달걀","egg"],["🧀","치즈","dairy fat"],
["🥛","우유","dairy"],["🧈","버터","dairy fat aroma"],["🍚","밥","grain"],["🍝","면","grain"],
["🍞","빵","grain"],["🥔","감자","veg"],["🥕","당근","veg sweet"],["🧅","양파","veg aroma"],
["🧄","마늘","veg aroma spicy"],["🌶️","고추","spicy"],["🍄","버섯","veg aroma"],["🥬","김치","veg spicy sour"],
["🥗","상추","veg"],["🍅","토마토","veg sour"],["🥦","브로콜리","veg"],["🌽","옥수수","veg sweet"],
["🍎","사과","fruit sweet"],["🍌","바나나","fruit sweet"],["🍓","딸기","fruit sweet sour"],["🍫","초콜릿","sweet fat"],
["🍯","꿀","sweet"],["🍋","레몬","fruit sour aroma"],["🧂","소금","salty"],["🥜","땅콩","nut fat"],
["🫘","콩","veg"],["⬜","두부","veg"]
];
const METHODS=[
{id:"grill",e:"🔥",l:"굽기"},{id:"stirfry",e:"🍳",l:"볶기"},{id:"boil",e:"🍲",l:"끓이기"},
{id:"fry",e:"🍤",l:"튀기기"},{id:"steam",e:"♨️",l:"찌기"},{id:"bake",e:"🥧",l:"오븐"},
{id:"mix",e:"🥗",l:"버무리기"},{id:"blend",e:"🥤",l:"갈기"}
];
const TAGS=["meat","fish","veg","grain","dairy","egg","sweet","sour","spicy","salty","fat","aroma","fruit"];
const MAX=6;
let shelf=ING.map(x=>({e:x[0],n:x[1],t:x[2].split(" ")}));
let pot=[],method="stirfry",book=[];

const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function customTags(n){const r=rng(hash(n));const a=[];while(a.length<2){const t=TAGS[Math.floor(r()*TAGS.length)];if(!a.includes(t))a.push(t)}return a}

function renderShelf(){
  $("shelf").innerHTML="";
  shelf.forEach((x,i)=>{
    const b=document.createElement("button");b.className="ing";b.type="button";
    b.innerHTML=`<span class="e">${x.e}</span><span>${x.n}</span>`;
    b.onclick=()=>addToPot(i);$("shelf").appendChild(b);
  });
}
function renderMethods(){
  $("methods").innerHTML="";
  METHODS.forEach(m=>{
    const b=document.createElement("button");b.className="m";b.type="button";
    b.textContent=m.e+" "+m.l;b.setAttribute("aria-pressed",m.id===method);
    b.onclick=()=>{method=m.id;renderMethods()};$("methods").appendChild(b);
  });
}
function renderPot(){
  const pan=$("pan");
  pan.querySelectorAll(".it").forEach(n=>n.remove());
  pot.forEach((i,idx)=>{
    const s=document.createElement("span");s.className="it";s.textContent=shelf[i].e;
    s.title=shelf[i].n+" (눌러서 빼기)";s.onclick=()=>{pot.splice(idx,1);renderPot()};
    pan.appendChild(s);
  });
  pan.classList.toggle("empty",!pot.length);
  $("count").textContent=pot.length+" / "+MAX;
  $("cook").disabled=!pot.length;
}
function addToPot(i){
  if(pot.length>=MAX){$("count").textContent="팬이 가득 찼어요 (최대 "+MAX+"개)";return}
  pot.push(i);renderPot();
}

$("addBtn").onclick=()=>{
  const n=$("custom").value.trim();if(!n)return;
  if(shelf.some(x=>x.n===n)){$("custom").value="";return}
  shelf.push({e:"🍽️",n,t:customTags(n),custom:true});
  store.set("customIng",shelf.filter(x=>x.custom));
  $("custom").value="";renderShelf();addToPot(shelf.length-1);
};
$("custom").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("addBtn").click()}});
$("clear").onclick=()=>{pot=[];renderPot()};
$("rand").onclick=()=>{
  pot=[];const pool=shelf.map((_,i)=>i).sort(()=>Math.random()-.5);
  pot=pool.slice(0,3);renderPot();
  method=METHODS[Math.floor(Math.random()*METHODS.length)].id;renderMethods();
};

function dish(items,mid){
  const names=items.map(i=>i.n).sort();
  const r=rng(hash(names.join(",")+mid));
  const T={};items.forEach(i=>i.t.forEach(t=>T[t]=(T[t]||0)+1));
  const has=t=>!!T[t];
  const protein=has("meat")||has("fish");
  // 점수 보정
  let fit=0;
  if(mid==="grill"&&protein)fit+=.5;
  if(mid==="fry"&&(protein||has("veg")))fit+=.4;
  if(mid==="stirfry"&&(has("veg")||protein))fit+=.3;
  if(mid==="boil"&&(protein||has("veg")))fit+=.3;
  if(mid==="steam"&&(has("fish")||has("egg")||has("veg")))fit+=.4;
  if(mid==="bake"&&has("dairy"))fit+=.5;
  if(mid==="mix"&&(has("veg")||has("fruit")))fit+=.4;
  if(mid==="blend"){fit+=(has("fruit")||has("dairy"))?.6:0;if(protein)fit-=1}
  let clash=0;
  if(has("fish")&&has("sweet")&&!has("spicy"))clash-=.7;
  if(has("fruit")&&has("meat")&&mid!=="bake")clash-=.4;
  if(has("dairy")&&has("sour")&&has("fish"))clash-=.4;
  const cl=v=>Math.max(1,Math.min(5,v));
  const taste=cl(2.2+r()*1.6+fit+clash+(has("fat")?.4:0)+(has("salty")?.3:0)+(has("spicy")&&has("sweet")?.3:0));
  const texture=cl(2+r()*2+(items.length>=3?.4:0)+(mid==="fry"?.5:0)+(mid==="steam"?.2:0));
  const aroma=cl(2+r()*2+(has("aroma")?.6:0)+(mid==="grill"||mid==="bake"?.3:0));
  const look=cl(2+r()*2+(items.length>=3?.5:0)+(has("veg")&&protein?.3:0));
  const avg=(taste+texture+aroma+look)/4;
  const score=Math.round(avg/5*100);
  // 이름
  let suf;
  if(mid==="grill")suf="구이";
  else if(mid==="stirfry")suf="볶음";
  else if(mid==="fry")suf="튀김";
  else if(mid==="steam")suf="찜";
  else if(mid==="mix")suf=(has("fruit")||has("sweet"))?"화채":"무침";
  else if(mid==="boil")suf=has("spicy")?"찌개":has("dairy")?"수프":"탕";
  else if(mid==="bake")suf=has("dairy")?"그라탱":has("sweet")?"파이":"오븐구이";
  else suf=has("fruit")||has("dairy")?"스무디":"주스";
  const mod=has("spicy")?"매콤":has("sweet")?"달콤":has("dairy")&&mid!=="blend"?"크림":has("sour")?"새콤":has("salty")?"짭짤":"";
  const main=names.length<=2?items.map(i=>i.n).join(" "):items.slice(0,2).map(i=>i.n).join(" ")+" 외 "+(items.length-2)+"종";
  const name=(mod?mod+" ":"")+main+" "+suf;
  const title=score>=88?"별 셋 셰프의 걸작":score>=76?"맛집 인정":score>=62?"집밥 합격":score>=48?"도전 정신 요리":"독창적인 실험작";
  const SAY={
    hi:["한 입 먹자마자 말이 사라졌어요. 재료들이 서로 양보한 맛이에요.","이 조합은 레시피북 맨 앞에 꽂아 둘 만해요.","향부터 합격입니다. 한 그릇 더 먹고 싶어요."],
    mid:["무난하게 맛있어요. 소금 한 꼬집이면 더 좋아질 것 같아요.","예상보다 훨씬 잘 어울려요. 손님이 재주문했어요.","집에서 꼭 한 번 해 먹을 맛이에요."],
    lo:["용기가 필요한 맛이에요. 그래도 한 번 먹으면 잊을 수 없어요.","재료들이 아직 서로 어색해하고 있어요. 다음엔 조리법을 바꿔 보세요.","맛은 모험, 비주얼은 예술입니다."]
  };
  const pool=score>=70?SAY.hi:score>=52?SAY.mid:SAY.lo;
  return{name,title,score,stats:{"맛":taste,"식감":texture,"향":aroma,"비주얼":look},say:pool[Math.floor(r()*pool.length)],avg};
}

$("cook").onclick=()=>{
  if(!pot.length)return;
  const pan=$("pan");pan.classList.add("cooking");$("cook").disabled=true;
  const items=pot.map(i=>shelf[i]);const mid=method;
  setTimeout(()=>{
    pan.classList.remove("cooking");$("cook").disabled=!pot.length;
    const d=dish(items,mid);const m=METHODS.find(x=>x.id===mid);
    $("rTitle").textContent=d.title;$("rName").textContent=d.name;
    const full=Math.round(d.avg);
    $("rStars").textContent="⭐".repeat(full)+"☆".repeat(5-full);
    $("rScore").textContent=d.score+"점 · "+m.l;
    $("rBars").innerHTML=Object.entries(d.stats).map(([k,v])=>`<span>${k}</span><div class="bar"><i style="width:${v/5*100}%"></i></div>`).join("");
    $("rSay").textContent=d.say;
    $("plate").innerHTML=items.map(i=>i.e).join("")+"<span style=\"flex-basis:100%;text-align:center\">"+m.e+"</span>";
    const res=$("result");res.classList.remove("show");void res.offsetWidth;res.classList.add("show");
    res.scrollIntoView({behavior:"smooth",block:"nearest"});
    book=book.filter(b=>b.name!==d.name);
    book.unshift({name:d.name,score:d.score,e:items.map(i=>i.e).join("")});
    book=book.slice(0,60);store.set("book",book);renderBook();
  },1600);
};

function renderBook(){
  $("book").innerHTML=book.map(b=>`<div class="rec"><b>${b.e} ${b.name.replace(/</g,"&lt;")}</b><span>${b.score}점</span></div>`).join("");
  $("bookEmpty").style.display=book.length?"none":"block";
  $("bookCount").textContent=book.length?"("+book.length+"개)":"";
}

(function init(){
  const c=store.get("customIng");if(Array.isArray(c))shelf=shelf.concat(c);
  const b=store.get("book");if(Array.isArray(b))book=b;
  renderShelf();renderMethods();renderPot();renderBook();
})();
</script>
</body>
</html>
